[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ShayanTabani", email = "shayantabaniawan@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain",
    "langchain-community",
    "langchain-ollama",
    "langchain-qdrant",
    "langchain-text-splitters",
    "pydantic",
    "pydantic-settings",
    "pypdf",
    "qdrant-client",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
